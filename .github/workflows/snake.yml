name: Generate Snake

on:
  schedule:
    - cron: "23 6 * * *"     # daily at 06:23 UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout (for the card builder script)
        uses: actions/checkout@v4

      - name: generate the snake path from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Fathi-Farhan
          outputs: |
            raw/snake.svg?color_snake=#F2B544&color_dots=#1B3B5E,#245C94,#3585CF,#6DB6F2,#D6E8FA

      - name: build the snake card and the activity card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/build_card.py --snake raw/snake.svg --out dist/snake.svg --activity-out dist/activity.svg --user Fathi-Farhan

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
