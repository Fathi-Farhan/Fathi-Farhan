<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Muhammad Fathi Farhan, full-stack developer and system analyst</title>
  <desc id="d">A drafting sheet showing an entity-relationship diagram that links requirement, schema and endpoint, next to a title block listing the stack and location.</desc>
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#16324F" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#1F446B" stroke-width="1"/>
    </pattern>
    <style>
      .sans{font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .flow{stroke-dasharray:5 7;animation:flow 1.6s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-24}}
      @media (prefers-reduced-motion:reduce){.flow{animation:none}}
    </style>
  </defs>

  <!-- sheet -->
  <rect width="1200" height="420" fill="#0E2238"/>
  <rect width="1200" height="420" fill="url(#major)"/>
  <rect x="16" y="16" width="1168" height="388" fill="none" stroke="#8FB4D9" stroke-width="1.5"/>

  <!-- identity -->
  <text class="sans" x="62" y="150" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#F4F8FC">Muhammad</text>
  <text class="sans" x="62" y="216" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#F4F8FC">Fathi Farhan</text>
  <text class="sans" x="64" y="262" font-size="22" fill="#9CC1E6">Full-stack developer and system analyst</text>
  <line x1="64" y1="292" x2="124" y2="292" stroke="#F2B544" stroke-width="2"/>
  <text class="mono" x="64" y="318" font-size="16" fill="#F2B544">ship the system, not just the code.</text>
  <text class="mono" x="64" y="376" font-size="13" fill="#6F96BE">Information Systems, Universitas Gunadarma</text>

  <!-- dimension line over the diagram -->
  <g stroke="#6F96BE" stroke-width="1">
    <line x1="664" y1="62" x2="1160" y2="62"/>
    <line x1="664" y1="56" x2="664" y2="68"/>
    <line x1="1160" y1="56" x2="1160" y2="68"/>
  </g>
  <rect x="852" y="52" width="120" height="20" fill="#0E2238"/>
  <text class="mono" x="912" y="67" font-size="12" text-anchor="middle" fill="#6F96BE">er diagram</text>

  <!-- relationships: static line, crow's foot, flowing dashes -->
  <g fill="none" stroke="#8FB4D9" stroke-width="1.5">
    <path d="M792 124H820V148H848"/>
    <path d="M976 124H1004V148H1032"/>
    <path d="M836 148L848 140M836 148L848 148M836 148L848 156"/>
    <path d="M1020 148L1032 140M1020 148L1032 148M1020 148L1032 156"/>
    <path d="M800 116V132"/>
    <path d="M984 116V132"/>
  </g>
  <g fill="none" stroke="#F2B544" stroke-width="2">
    <path class="flow" d="M792 124H820V148H848"/>
    <path class="flow" d="M976 124H1004V148H1032"/>
  </g>

  <!-- entity: requirement -->
  <g>
    <rect x="664" y="84" width="128" height="100" fill="#0E2238" stroke="#CFE0F2" stroke-width="1.5"/>
    <rect x="664" y="84" width="128" height="28" fill="#CFE0F2"/>
    <text class="mono" x="676" y="103" font-size="14" font-weight="700" fill="#0E2238">requirement</text>
    <text class="mono" x="676" y="129" font-size="13" fill="#CFE0F2">id</text>
    <text class="mono" x="778" y="129" font-size="11" text-anchor="end" fill="#F2B544">pk</text>
    <text class="mono" x="676" y="153" font-size="13" fill="#CFE0F2">actor</text>
    <text class="mono" x="676" y="177" font-size="13" fill="#CFE0F2">outcome</text>
  </g>

  <!-- entity: schema -->
  <g>
    <rect x="848" y="84" width="128" height="100" fill="#0E2238" stroke="#CFE0F2" stroke-width="1.5"/>
    <rect x="848" y="84" width="128" height="28" fill="#CFE0F2"/>
    <text class="mono" x="860" y="103" font-size="14" font-weight="700" fill="#0E2238">schema</text>
    <text class="mono" x="860" y="129" font-size="13" fill="#CFE0F2">id</text>
    <text class="mono" x="962" y="129" font-size="11" text-anchor="end" fill="#F2B544">pk</text>
    <text class="mono" x="860" y="153" font-size="13" fill="#CFE0F2">req_id</text>
    <text class="mono" x="962" y="153" font-size="11" text-anchor="end" fill="#F2B544">fk</text>
    <text class="mono" x="860" y="177" font-size="13" fill="#CFE0F2">entity</text>
  </g>

  <!-- entity: endpoint -->
  <g>
    <rect x="1032" y="84" width="128" height="100" fill="#0E2238" stroke="#CFE0F2" stroke-width="1.5"/>
    <rect x="1032" y="84" width="128" height="28" fill="#CFE0F2"/>
    <text class="mono" x="1044" y="103" font-size="14" font-weight="700" fill="#0E2238">endpoint</text>
    <text class="mono" x="1044" y="129" font-size="13" fill="#CFE0F2">id</text>
    <text class="mono" x="1146" y="129" font-size="11" text-anchor="end" fill="#F2B544">pk</text>
    <text class="mono" x="1044" y="153" font-size="13" fill="#CFE0F2">schema_id</text>
    <text class="mono" x="1146" y="153" font-size="11" text-anchor="end" fill="#F2B544">fk</text>
    <text class="mono" x="1044" y="177" font-size="13" fill="#CFE0F2">contract</text>
  </g>

  <!-- note -->
  <text class="mono" x="664" y="240" font-size="13" fill="#9CC1E6">Data models, ERDs, architecture docs:</text>
  <text class="mono" x="664" y="260" font-size="13" fill="#9CC1E6">the work that decides whether a product</text>
  <text class="mono" x="664" y="280" font-size="13" fill="#9CC1E6">survives its second sprint.</text>

  <!-- title block -->
  <g fill="none" stroke="#8FB4D9" stroke-width="1">
    <rect x="664" y="326" width="496" height="64"/>
    <line x1="664" y1="358" x2="1160" y2="358"/>
    <line x1="744" y1="326" x2="744" y2="390"/>
  </g>
  <text class="mono" x="676" y="347" font-size="12" fill="#6F96BE">stack</text>
  <text class="mono" x="756" y="347" font-size="14" fill="#F4F8FC">Next.js, Laravel, PostgreSQL</text>
  <text class="mono" x="676" y="379" font-size="12" fill="#6F96BE">based in</text>
  <text class="mono" x="756" y="379" font-size="14" fill="#F4F8FC">East Jakarta, Indonesia</text>
</svg>
